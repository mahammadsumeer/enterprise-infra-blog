<text x="60" y="1240" class="tiny">IP plan based on the article's inventory: WAN 192.0.2.0/30; DMZ 10.10.10.0/24; Internal 10.10.20.0/24; Management 10.10.30.0/24. VLAN 40 is an added isolated validation segment.</text>
