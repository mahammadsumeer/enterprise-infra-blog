<title id="title">Lab: Ethical Hacking — Metasploit Detection and Enterprise Network Segmentation</title>
<desc id="desc">EVE-NG topology with pfSense perimeter firewall, isolated simulated WAN, DMZ Ubuntu web and mail servers, internal Windows Active Directory DNS DHCP, file server and workstation, management ELK SIEM and Kali SOC workstation. All networks are isolated; diagram is for defensive telemetry and controlled validation, not AV evasion or post-exploitation instructions.</desc>
