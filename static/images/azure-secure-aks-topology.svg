<path d="M1110 985 V955 H1180 V865" class="govern"/>
<text x="915" y="948" class="tiny">Policy evaluation / compliance</text>

<!-- Flow legend and caveats -->
<rect x="60" y="535" width="380" height="575" rx="16" fill="#FBFCFE" stroke="#C7D3DE" stroke-width="1.5"/>
<text x="88" y="575" class="label">Deployment &amp; runtime flow</text>
<g class="small">
 <text x="90" y="620">1. GitHub Actions builds and pushes</text><text x="110" y="642">the container image to ACR.</text>
 <text x="90" y="680">2. Flux watches app-manifests for</text><text x="110" y="702">desired-state changes.</text>
 <text x="90" y="740">3. Flux applies manifests / HelmRelease</text><text x="110" y="762">and rolls out workloads to AKS.</text>
 <text x="90" y="800">4. AKS nodes pull approved images</text><text x="110" y="822">from Azure Container Registry.</text>
 <text x="90" y="860">5. CSI driver + Azure provider fetch</text><text x="110" y="882">secrets from Key Vault into pod volumes.</text>
 <text x="90" y="920">6. Container Insights sends telemetry</text><text x="110" y="942">to the Log Analytics workspace.</text>
</g>
<line x1="90" y1="978" x2="145" y2="978" class="flowblue"/><text x="160" y="983" class="tiny">Data / deployment flow</text>
<line x1="90" y1="1015" x2="145" y2="1015" class="govern"/><text x="160" y="1020" class="tiny">Governance / policy relationship</text>
<line x1="90" y1="1052" x2="145" y2="1052" class="telemetry"/><text x="160" y="1057" class="tiny">Monitoring telemetry</text>
<text x="88" y="1090" class="tiny">Conceptual logical architecture; not a live deployment.</text>

<text x="60" y="1195" class="tiny">Source: Enterprise Infra &amp; Cloud Labs — “Azure Lab: Secure AKS Deployment with Azure Policy, Key Vault Integration, and CI/CD” (24 Nov 2026).</text>
<text x="60" y="1218" class="tiny">Design note: the article's sample Bicep leaves ACR and Key Vault public network access allowed; private endpoints / private DNS and full egress controls are not shown as deployed.</text>
</svg>