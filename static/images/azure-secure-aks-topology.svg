    .flow{fill:none;stroke:#526579;stroke-width:2.8;marker-end:url(#arrow)}
    .flowblue{fill:none;stroke:#0078D4;stroke-width:3;marker-end:url(#blueArrow)}
    .flowgreen{fill:none;stroke:#107C41;stroke-width:3;marker-end:url(#greenArrow)}
    .govern{fill:none;stroke:#6B55A3;stroke-width:2.5;stroke-dasharray:8 6}
    .telemetry{fill:none;stroke:#C66A12;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .tag{font-size:12px;font-weight:700;fill:#fff}
