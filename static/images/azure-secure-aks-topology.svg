<path d="M355 410 H430 V720 H1360" class="flowblue"/>
<text x="455" y="705" class="small">1  Build &amp; push container image</text>
<path d="M332 310 V325 H1190 V515" class="govern"/>
<text x="865" y="318" class="tiny">2  GitOps source monitored by Flux</text>
<path d="M960 570 H930 V742 H930" class="flowgreen"/>
<path d="M1090 630 V675" class="flowgreen"/>
<text x="1130" y="652" class="tiny">3  Reconcile manifests</text>
