<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
<title id="title">Azure secure AKS architecture with Azure Policy, Key Vault and GitHub Actions CI/CD</title>
<desc id="desc">Architecture based on the linked lab: GitHub Actions builds and pushes images to Azure Container Registry; Flux reconciles manifests into a private AKS cluster; AKS workloads retrieve secrets from Key Vault through the Secrets Store CSI provider; Azure Policy governs the cluster; Azure Monitor sends telemetry to Log Analytics.</desc>
