    .boundary{fill:#F7FBFF;stroke:#0078D4;stroke-width:3}
    .rg{fill:#EDF6FC;stroke:#4A9BD6;stroke-width:2;stroke-dasharray:9 6}
    .vnet{fill:#F1F8FD;stroke:#2586C8;stroke-width:2.5}
    .subnet{fill:#FFFFFF;stroke:#7AAFD4;stroke-width:2;stroke-dasharray:6 4}
